name: Test install.sh

on:
  push:
    paths:
      - "install.sh"
      - "ir-only.patch"
      - ".github/workflows/test-install.yml"
  schedule:
    # Weekly health check: detects when upstream tunnel-core moves under us.
    - cron: "0 7 * * 1"  # Mondays at 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install.sh
        run: bash ./install.sh

      - name: Verify IR-only binary exists and runs
        run: |
          BIN="$HOME/repos/conduit-ir/cli/dist/conduit"
          test -x "$BIN" || { echo "Binary missing"; exit 1; }
          "$BIN" --version
          "$BIN" --help | head -5

      - name: Verify IR-only restriction is in source
        run: |
          PROXY="$HOME/repos/conduit-ir/cli/psiphon-tunnel-core/psiphon/common/inproxy/proxy.go"
          grep -q "IR-only allowlist" "$PROXY" || { echo "Restriction not in source"; exit 1; }
          echo "IR-only restriction confirmed in proxy.go"

      - name: Verify restriction is compiled into the binary
        run: |
          BIN="$HOME/repos/conduit-ir/cli/dist/conduit"
          # grep -c (not -q): GitHub Actions runs bash with pipefail, and
          # `strings | grep -q` makes strings die with SIGPIPE on first match,
          # falsely failing the step. grep -c reads the whole stream.
          COUNT="$(strings "$BIN" | grep -c "client region not allowed" || true)"
          [ "${COUNT:-0}" -ge 1 ] || { echo "IR-only marker missing from compiled binary"; exit 1; }
          echo "IR-only restriction confirmed in binary"

      - name: Verify the fork's go.mod replace is in place
        run: |
          MOD="$HOME/repos/conduit-ir/cli/go.mod"
          grep -q "replace github.com/Psiphon-Labs/psiphon-tunnel-core =>" "$MOD" || \
            { echo "replace directive missing"; exit 1; }
          echo "replace directive confirmed in go.mod"

      - name: Re-run install.sh (idempotency check)
        run: bash ./install.sh
