name: Build and publish binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required to upload release assets

jobs:
  build:
    name: Build patched Conduit binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run install.sh to fetch and patch sources
        run: bash ./install.sh

      - name: Build patched Conduit for all platforms
        run: |
          cd ~/repos/conduit/cli
          make build-all

      - name: Build extract-config for all platforms
        run: |
          cd "$GITHUB_WORKSPACE/extract-config"
          mkdir -p "$GITHUB_WORKSPACE/release"
          for plat in \
              "darwin amd64" \
              "darwin arm64" \
              "linux amd64" \
              "linux arm64" \
              "windows amd64"; do
            set -- $plat
            os=$1; arch=$2
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="$GITHUB_WORKSPACE/release/extract-config-${os}-${arch}${ext}"
            echo "Building $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "$out" .
          done

      - name: Stage Conduit binaries
        run: |
          cd ~/repos/conduit/cli/dist
          for f in conduit-linux-amd64 conduit-linux-arm64 \
                   conduit-darwin-amd64 conduit-darwin-arm64 \
                   conduit-windows-amd64.exe; do
            if [ -f "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/release/conduit-ir-${f#conduit-}"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/release/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Conduit IR-only — patched binaries

            **What:** Unofficial build of [Psiphon Conduit](https://github.com/Psiphon-Inc/conduit) that relays traffic only for clients in Iran.

            **Get started:** see https://github.com/adpunt/conduit-ir-patch — three steps total.

            **License:** GPL-3.0. **Not affiliated with Psiphon Inc.**

            ### Which file do I download?

            | Your computer | Download this file |
            |---|---|
            | Mac with Apple Silicon (M1/M2/M3/M4) | `conduit-ir-darwin-arm64` |
            | Mac with Intel chip | `conduit-ir-darwin-amd64` |
            | Windows | `conduit-ir-windows-amd64.exe` |
            | Linux (most) | `conduit-ir-linux-amd64` |
            | Linux on ARM (Raspberry Pi etc.) | `conduit-ir-linux-arm64` |

            You also need the matching `extract-config-*` (bundled above) to get a Psiphon config.
